# The workshop on several replicas behind Traefik, all on one PostgreSQL. See
# README.md in this folder. From the root of the repository:
#
#   docker compose -f examples/workshop/cluster/compose.yml up -d --build --wait
#   docker compose -f examples/workshop/cluster/compose.yml up -d --scale workshop=5
#
# The UI and the API share one origin, http://localhost:8080: Traefik sends the
# API's paths to the replicas, in turn, and everything else to the UI. Its
# dashboard is on http://localhost:8081.
name: effect-cqrs-cluster

x-defaults:
  # Development values anyone can read here. Override them from the environment,
  # or a .env file next to this one, before letting anyone else in.
  auth-secret: &auth-secret ${AUTH_SECRET:-cluster-demo-secret-change-me}
  master-key: &master-key ${PERSONAL_DATA_MASTER_KEY:-d29ya3Nob3AtZGV2ZWxvcG1lbnQtbWFzdGVyLWtleSE=}

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "${WORKSHOP_PORT:-8080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 1s
      timeout: 3s
      retries: 30

  workshop:
    build:
      context: ../../..
      dockerfile: examples/workshop/Dockerfile
    image: effect-cqrs-workshop
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/workshop
      AUTH_SECRET: *auth-secret
      ADMIN_CODE: ${ADMIN_CODE:-prova}
      PERSONAL_DATA_MASTER_KEY: *master-key
      PERSONAL_DATA_MASTER_KEY_ID: ${PERSONAL_DATA_MASTER_KEY_ID:-cluster-demo}
    # Time to give up the leases, so another replica takes over at once.
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.workshop-api.entrypoints: web
      traefik.http.routers.workshop-api.rule: >-
        Path(`/health`) || Path(`/asyncapi.json`) || Path(`/openapi.json`) || PathPrefix(`/docs`) ||
        PathPrefix(`/auth`) || PathPrefix(`/me`) || PathPrefix(`/participants`) || PathPrefix(`/shop`) ||
        PathPrefix(`/admin`) || PathPrefix(`/stream`)
      traefik.http.services.workshop-api.loadbalancer.server.port: "3000"
      # A replica that stops answering leaves the rotation within a couple of seconds.
      traefik.http.services.workshop-api.loadbalancer.healthCheck.path: /health
      traefik.http.services.workshop-api.loadbalancer.healthCheck.interval: 2s
      traefik.http.services.workshop-api.loadbalancer.healthCheck.timeout: 1s

  ui:
    build:
      context: ../../..
      dockerfile: examples/workshop/ui/Dockerfile
    image: effect-cqrs-workshop-ui
    labels:
      traefik.enable: "true"
      traefik.http.routers.workshop-ui.entrypoints: web
      traefik.http.routers.workshop-ui.rule: PathPrefix(`/`)
      traefik.http.routers.workshop-ui.priority: "1"
      traefik.http.services.workshop-ui.loadbalancer.server.port: "80"

volumes:
  postgres:
